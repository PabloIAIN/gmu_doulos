name: gmu_doulos
description: Aplicación para el Club de Guías Mayores GMU Doulos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Base de datos local (Unidad III)
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Mapas y GPS (Unidad III)
  # google_maps_flutter: ^2.5.0
  # geolocator: ^10.1.0
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1

  # Notificaciones (Unidad III)
  flutter_local_notifications: ^18.0.0
  
  # Compartir e Intents (Unidad III)
  # share_plus: ^7.2.1
  url_launcher: ^6.2.1
  
  # Cámara (Unidad IV)
  # camera: ^0.10.5+5
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  
  # Sensores (Unidad IV)
  # sensors_plus: ^4.0.2
  # flutter_compass: ^0.8.0
  # torch_light: ^1.0.0

  # HTTP
  http: ^1.2.0

  # Tipografia
  google_fonts: ^6.1.0

  # Graficas
  fl_chart: ^0.69.0

  # PDF y compartir
  pdf: ^3.11.1
  share_plus: ^10.1.4
  open_filex: ^4.5.0

  # Autenticación
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

# Configuracion del splash screen nativo
flutter_native_splash:
  color: "#1B5E20"
  image: assets/images/guias_mayores_logo.png
  color_dark: "#0D3311"
  image_dark: assets/images/guias_mayores_logo.png
  android_12:
    color: "#1B5E20"
    icon_background_color: "#1B5E20"
    image: assets/images/guias_mayores_logo.png
    color_dark: "#0D3311"
    icon_background_color_dark: "#0D3311"
    image_dark: assets/images/guias_mayores_logo.png

# Configuracion del icono de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/guias_mayores_logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/guias_mayores_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/